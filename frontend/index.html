<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <meta name="theme-color" content="#063f3a">
  <link rel="manifest" href="manifest.webmanifest">
  <title>WINBD-PRO</title>
  <link rel="stylesheet" href="style.css?v=20260820-3">
</head>
<body>
<header class="topbar">
  <button class="menu-btn" onclick="document.body.classList.toggle('sidebar-open')" aria-label="মেনু">☰</button>
  <a class="brand" href="#" onclick="show('home');return false">
    <img class="brand-logo" src="https://avatars.githubusercontent.com/u/311884454?v=4" alt="WINBD-PRO">
    <span>WINBD<span>-PRO</span></span>
  </a>
  <nav>
    <button onclick="show('home')">হোম</button>
    <button onclick="show('games')">গেমস</button>
    <button onclick="show('wallet')">ওয়ালেট</button>
    <button onclick="show('profile')">প্রোফাইল</button>
    <button onclick="show('history')">হিস্টোরি</button>
    <button onclick="show('promotions')">বোনাস</button>
    <button onclick="show('support')">সাপোর্ট</button>
    <button id="logout" onclick="logout()" hidden>লগআউট</button>
  </nav>
  <div class="top-actions">
    <button id="loginBtn" class="login-link" onclick="openModal('login')">লগইন</button>
    <button id="registerBtn" class="signup-btn" onclick="openModal('register')">রেজিস্টার</button>
  </div>
</header>

<div class="site-layout">
  <aside class="side-menu">
    <div class="side-title">গেম ক্যাটাগরি</div>
    <button onclick="show('games');setGameFilter('all')">🔥 গরম খেলা</button>
    <button onclick="show('games');setGameFilter('JILI')">🎰 JILI</button>
    <button onclick="show('games');setGameFilter('Super Ace')">🃏 Super Ace</button>
    <button onclick="show('games');setGameFilter('Slots')">🎰 স্লট</button>
    <button onclick="show('games');setGameFilter('Live Casino')">🎥 লাইভ</button>
    <button onclick="show('games');setGameFilter('Sports')">⚽ স্পোর্টস</button>
    <button onclick="show('games');setGameFilter('Fishing')">🎣 ফিশিং</button>
    <button onclick="show('games');setGameFilter('Arcade')">🕹️ আর্কেড</button>
    <button onclick="show('games');setGameFilter('Crash')">💥 ক্র্যাশ</button>
    <button onclick="show('games');setGameFilter('Table Games')">🎲 টেবিল</button>
    <button onclick="show('promotions')">🎁 অফার</button>
    <button onclick="show('support')">🎧 সাপোর্ট</button>
  </aside>

  <main class="main-content">
    <section id="home" class="page home-page">
      <div class="promo-banner">
        <div>
          <span class="eyebrow">WINBD-PRO</span>
          <h1>আপনার গেমিং জোন</h1>
          <p>সব ক্যাটাগরি, প্রোফাইল, ওয়ালেট ও হিস্টোরি—এক জায়গায়।</p>
          <div class="hero-actions">
            <button class="primary big" onclick="show('games')">গেমস দেখুন</button>
            <button class="ghost big" onclick="show('wallet')">ওয়ালেট</button>
          </div>
        </div>
        <div class="banner-logo">
          <img src="https://avatars.githubusercontent.com/u/311884454?v=4" alt="WINBD-PRO">
        </div>
      </div>
      <div id="homeGameGrid" class="game-grid home-game-grid"></div>
    </section>

    <section id="games" class="page" hidden>
      <div class="section-head"><div><h2>গেম ক্যাটাগরি</h2></div></div>
      <div id="gameGrid" class="game-grid"></div>
    </section>
  </main>
</div>

<script src="app.js?v=20260820-3"></script>
<script src="auth-gate.js?v=20260820-1"></script>
</body>
</html>
