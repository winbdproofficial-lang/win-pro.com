<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINBD-PRO</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">WINBD-PRO</div><nav><button onclick="show('home')">Home</button><button onclick="show('wallet')">Wallet</button><button onclick="show('profile')">Profile</button><button id="logout" onclick="logout()" hidden>Logout</button></nav></header><main><section id="home" class="page"><div class="hero"><div><span class="eyebrow">WINBD-PRO</span><h1>স্বাগতম</h1><p>আপনার অ্যাকাউন্ট, ওয়ালেট এবং পেমেন্ট ইন্টেন্ট নিরাপদভাবে ম্যানেজ করুন।</p><div class="actions"><button class="primary" onclick="openModal('login')">Login</button><button onclick="openModal('register')">Create account</button></div></div><div class="hero-card"><b>API status</b><strong id="health">Checking…</strong><small>Backend health endpoint</small></div></div><div class="cards"><div class="card"><span>Security</span><b>JWT + bcrypt</b></div><div class="card"><span>Database</span><b>PostgreSQL</b></div><div class="card"><span>Admin</span><b>Role protected</b></div></div></section><section id="wallet" class="page" hidden><div class="card"><h2>Wallet</h2><div id="walletData">Login required.</div><div class="forms"><form onsubmit="payment(event,'deposit')"><h3>Deposit intent</h3><input id="depAmount" type="number" min="1" step="0.01" placeholder="Amount" required><select id="depMethod"><option>bKash</option><option>Nagad</option><option>Rocket</option></select><button class="primary">Create intent</button></form><form onsubmit="payment(event,'withdraw')"><h3>Withdrawal request</h3><input id="wdAmount" type="number" min="1" step="0.01" placeholder="Amount" required><select id="wdMethod"><option>bKash</option><option>Nagad</option><option>Rocket</option></select><button class="primary">Request withdrawal</button></form></div></div></section><section id="profile" class="page" hidden><div class="card"><h2>Profile</h2><div id="profileData">Login required.</div></div></section></main><div id="modal" class="modal" hidden><div class="modal-card"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><div id="toast"></div><script src="app.js"></script></body></html>
