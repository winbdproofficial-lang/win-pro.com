<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071313">
<title>WINBD-PRO • Demo Game</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071313;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;justify-content:center}.wrap{width:min(480px,100%);min-height:100vh;background:radial-gradient(circle at 50% 12%,#1a4f48,#071313 48%);padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;letter-spacing:1px;color:#ffd44d}.demo{font-size:11px;background:#f0b90b;color:#161616;border-radius:999px;padding:6px 9px;font-weight:800}.card{margin-top:14px;background:#0d2422;border:1px solid #24534d;border-radius:18px;padding:16px;box-shadow:0 18px 45px #0008}.title{text-align:center;font-size:22px;font-weight:900;margin:4px 0}.sub{text-align:center;color:#9dc7c2;font-size:12px;margin-bottom:14px}.balance{display:flex;justify-content:space-between;align-items:center;background:#09201e;border-radius:12px;padding:11px 13px;margin-bottom:14px}.balance b{font-size:22px;color:#63e6c9}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#05100f;border:2px solid #dcae20;border-radius:14px;padding:9px}.reel{height:100px;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#ddd);color:#222;border-radius:10px;font-size:48px;box-shadow:inset 0 -10px 20px #0002}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.controls input{width:100%;padding:12px;border-radius:10px;border:1px solid #376860;background:#061716;color:#fff}.spin{grid-column:1/-1;border:0;border-radius:12px;padding:14px;background:#f5c21a;color:#171717;font-size:17px;font-weight:900;cursor:pointer}.spin:disabled{opacity:.55;cursor:wait}.msg{text-align:center;min-height:22px;margin-top:10px;color:#b8d9d4;font-size:13px}.note{margin-top:14px;color:#89aca8;font-size:11px;line-height:1.5;text-align:center}.back{display:block;text-align:center;margin-top:12px;color:#8ce4d0;text-decoration:none;font-size:13px}.win{color:#6ff0b0!important}.lose{color:#ff9c9c!important}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div class="brand">WINBD-PRO</div><div class="demo">DEMO MODE</div></div>
  <section class="card">
    <div class="title" id="gameTitle">Demo Slot</div>
    <div class="sub">Virtual credits only • No real-money wagering</div>
    <div class="balance"><span>Demo balance</span><b id="balance">1,000.00</b></div>
    <div class="reels"><div class="reel" id="r1">🍒</div><div class="reel" id="r2">💎</div><div class="reel" id="r3">7️⃣</div></div>
    <div class="controls">
      <label>Bet<br><input id="bet" type="number" min="1" max="100" step="1" value="10"></label>
      <label>Mode<br><input value="Virtual only" disabled></label>
      <button class="spin" id="spin">SPIN</button>
    </div>
    <div class="msg" id="msg">Ready to play the demo.</div>
    <div class="note">This is a testing simulator. It does not connect to a game provider, payment gateway, wallet, or real-money settlement.</div>
    <a class="back" href="/">← Back to WINBD-PRO</a>
  </section>
</main>
<script>
const q=new URLSearchParams(location.search);
const game=q.get('game')||'Demo Slot';
const key='winbd_demo_'+(q.get('session')||crypto.randomUUID());
const saved=JSON.parse(localStorage.getItem(key)||'null');
let balance=Number(saved?.balance??1000);
const symbols=['🍒','🍋','🔔','⭐','💎','7️⃣','🍀','🎯'];
const $=id=>document.getElementById(id);
$('gameTitle').textContent=game;
function render(){ $('balance').textContent=balance.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function save(){localStorage.setItem(key,JSON.stringify({balance,updatedAt:Date.now()}));}
function pick(){return symbols[Math.floor(Math.random()*symbols.length)];}
function spin(){
 const btn=$('spin'), bet=Math.floor(Number($('bet').value));
 if(!Number.isFinite(bet)||bet<1||bet>100){$('msg').textContent='Bet must be between 1 and 100 demo credits.';return;}
 if(balance<bet){$('msg').textContent='Demo balance is too low. Refresh this demo session to start again.';return;}
 btn.disabled=true;$('msg').textContent='Spinning…';
 setTimeout(()=>{
   const a=pick(),b=pick(),c=pick();$('r1').textContent=a;$('r2').textContent=b;$('r3').textContent=c;
   balance-=bet;let win=0;
   if(a===b&&b===c)win=bet*8;else if(a===b||b===c||a===c)win=bet*2;
   balance+=win;save();render();
   $('msg').textContent=win?`Demo win: +${win.toFixed(2)} credits`:`Demo result: -${bet.toFixed(2)} credits`;
   $('msg').className='msg '+(win?'win':'lose');btn.disabled=false;
 },450);
}
$('spin').addEventListener('click',spin);render();
</script>
</body>
</html>
