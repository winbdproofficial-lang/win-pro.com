<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINBD-PRO Admin</title><link rel="stylesheet" href="styles.css"><style>#winbdSplash{position:fixed;inset:0;z-index:999999;background:radial-gradient(circle at 50% 45%,#0c7166,#031b18 72%);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .45s ease,visibility .45s ease}#winbdSplash.hide{opacity:0;visibility:hidden;pointer-events:none}#winbdSplash .splash-inner{text-align:center;color:#fff;padding:24px}#winbdSplash .splash-brand{font-size:clamp(34px,9vw,72px);font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 4px 20px #0008}#winbdSplash .splash-title{margin-top:14px;font-size:clamp(24px,6vw,48px);font-weight:800}#winbdSplash .splash-line{width:180px;height:4px;background:#e22;margin:22px auto;border-radius:99px}</style></head><body><div id="winbdSplash"><div class="splash-inner"><div class="splash-brand">WINBD-PRO</div><div class="splash-title">WINBD-OFFICIAL</div><div class="splash-line"></div><div>Loading Admin Panel…</div></div></div><div id="loginScreen" class="login-screen"><div class="login-card"><div class="logo-text">WINBD</div><h1>WINBD-PRO</h1><p>Admin Control Panel</p><form id="loginForm"><input id="adminUser" placeholder="Username" required><input id="adminPass" type="password" placeholder="Password" required><button class="primary">Sign in</button><div id="loginMsg"></div></form></div></div><div id="app" class="app" hidden><aside class="sidebar"><div class="brand"><div class="logo-text small">WINBD</div><div><strong>WINBD-PRO</strong><span>CONTROL PANEL</span></div></div><nav><button class="nav active" data-page="dashboard">⌂ Dashboard</button><button class="nav" data-page="users">◉ Players</button><button class="nav" data-page="payments">৳ Payments</button><button class="nav" data-page="audit">≡ Audit Logs</button></nav><div class="side-note"><b>Gateway</b><span>Provider-neutral</span><small>Configure a licensed provider on the server.</small></div><button class="logout" onclick="adminLogout()">Sign out</button></aside><main class="main"><header class="top"><div><p class="eyebrow">WINBD-PRO / ADMIN</p><h1 id="pageTitle">Dashboard</h1></div><div id="adminName" class="admin-name"></div></header><section id="content"></section></main></div><div id="toast"></div><script src="app.js"></script><script>(function(){const s=document.getElementById('winbdSplash');const start=Date.now();setTimeout(function(){const left=Math.max(0,1500-(Date.now()-start));setTimeout(function(){s.classList.add('hide');setTimeout(()=>s.remove(),500)},left)},1500)})();</script></body></html>
